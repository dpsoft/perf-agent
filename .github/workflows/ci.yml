name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-18 \
          llvm-18 \
          libelf-dev \
          linux-headers-$(uname -r) \
          build-essential \
          pkg-config \
          libbpf-dev

        # bpf2go invokes `clang` and `llvm-strip` by bare name, and the
        # versioned packages do not provide them. Pinning the version is only
        # half the job — these symlinks are what make the pin take effect.
        # Issue #87.
        sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
        sudo ln -sf /usr/bin/llvm-strip-18 /usr/local/bin/llvm-strip
        clang --version | head -1
        
        # Ensure bpf headers are available
        if [ ! -f /usr/include/bpf/bpf_helpers.h ]; then
          echo "Installing libbpf from source..."
          git clone https://github.com/libbpf/libbpf.git /tmp/libbpf
          cd /tmp/libbpf/src
          sudo make install install_headers
          sudo ldconfig
        fi
    
    - name: Build and install blazesym
      run: |
        git clone https://github.com/libbpf/blazesym.git /tmp/blazesym
        cd /tmp/blazesym
        echo "Building blazesym C bindings package..."
        cargo build --release --package blazesym-c
        echo "Built files:"
        ls -lh target/release/libblazesym* || echo "No libblazesym files"
        echo ""
        echo "Installing to /usr/local..."
        sudo mkdir -p /usr/local/include /usr/local/lib
        sudo cp capi/include/blazesym.h /usr/local/include/
        sudo cp target/release/libblazesym_c.a /usr/local/lib/
        sudo ldconfig
        echo "✓ blazesym installed"
    
    - name: Configure blazesym Go module
      run: |
        go mod edit -replace github.com/libbpf/blazesym/go=/tmp/blazesym/go
        cd test && go mod edit -replace github.com/libbpf/blazesym/go=/tmp/blazesym/go

    - name: "Fingerprint the BPF toolchain (issue #87)"
      # Diagnostic only. Never fails the job.
      #
      # Two machines with the same clang (18.1.3) and byte-identical libbpf
      # headers (libbpf-dev 1:1.3.0-2build2, verified against the noble archive
      # .deb) have produced different .BTF type orderings for the same source --
      # six bytes, two transpositions, every other section identical. Every
      # candidate visible from a container has been eliminated: regen
      # determinism, clang version (changes the SIZE), llvm-strip version (no
      # effect), libbpf header version, the blazesym module replace, and the
      # go generate invocation style.
      #
      # What is left is something in the runner environment that no workflow
      # script mentions. CPATH and its relatives inject include directories
      # invisibly, and `clang -H` is the only way to learn which bpf_helpers.h is
      # actually OPENED rather than which directories are merely searched.
      #
      # Printed unconditionally, on green runs too: a fingerprint that appears
      # only on failure cannot establish what a passing run looked like, and
      # comparing green against red is how an intermittent mismatch gets settled.
      continue-on-error: true
      run: |
        clang --version | head -1
        go version
        go list -m github.com/cilium/ebpf || true
        dpkg-query -W -f='libbpf-dev %{Version}\n' libbpf-dev || true
        echo "--- /usr/local/include (anything named bpf here shadows /usr/include/bpf) ---"
        ls -la /usr/local/include/ || true
        echo "--- which bpf_helpers.h clang actually opens ---"
        echo '#include <bpf/bpf_helpers.h>' | clang -H -E -x c - 2>&1 | grep -m5 bpf_helpers.h || true
        echo "--- header hashes ---"
        sha256sum /usr/include/bpf/*.h 2>/dev/null || true
        sha256sum /usr/local/include/bpf/*.h 2>/dev/null || echo "no /usr/local/include/bpf (expected)"
        echo "--- include-injecting environment ---"
        env | grep -Ei '^(CPATH|C_INCLUDE_PATH|CPLUS_INCLUDE_PATH|OBJC_INCLUDE_PATH|CFLAGS|CC|CXX|BPF2GO)=' || echo "none set"

    - name: Run go generate
      run: go generate ./...

    # Regeneration must not change the committed objects. Issue #87.
    #
    # `go generate` already ran above and its output was never checked, so a
    # committed object could disagree with what the toolchain produces and
    # nothing said so. Two tasks in the GPU phase hit exactly that, reverted
    # the files by hand to keep their commits scoped, and could only confirm
    # "generate is idempotent" with a standing exception for three packages —
    # which is the kind of exception that hides a real regeneration bug later.
    #
    # A failure here means one of two things, and the diff says which:
    #   - a source change was made without committing the regenerated object
    #   - this runner's clang produces different bytes from the one that
    #     produced the committed objects, in which case the toolchain needs
    #     pinning rather than the objects re-committing

    - name: "Record regenerated object fingerprints (issue #87)"
      # What THIS runner's toolchain produced, recorded on every run including
      # green ones, so a future mismatch is a two-line diff rather than another
      # investigation. Diagnostic only; never fails the job.
      continue-on-error: true
      run: |
        for f in $(git ls-files '*_bpfel.o'); do
          printf '%s regenerated=%s sha256=%s committed=%s\n' \
            "$f" "$(wc -c < "$f")" "$(sha256sum "$f" | cut -d" " -f1)" \
            "$(git show HEAD:"$f" | wc -c)"
        done
        echo "--- objects differing from HEAD (empty means this runner reproduces them) ---"
        git diff --name-only -- '*_bpfel.go' '*_bpfel.o' || true

    - name: Verify generated objects are up to date
      run: |
        if ! git diff --quiet -- '*_bpfel.go' '*_bpfel.o'; then
          echo "::error::go generate changed committed files; see the diff below"
          git diff --stat -- '*_bpfel.go' '*_bpfel.o'
          echo "--- per-file byte sizes (same size + differing bytes usually means BTF ordering) ---"
          git diff --name-only -- '*_bpfel.go' '*_bpfel.o' | while read -r f; do
            printf '%s committed=%s regenerated=%s\n' "$f" \
              "$(git show HEAD:"$f" | wc -c)" "$(wc -c < "$f")"
          done
          exit 1
        fi
        echo "✓ generated objects match the committed ones"

    - name: "Upload regenerated objects for byte comparison (issue #87)"
      # The capability this investigation lacked for four rounds. Every earlier
      # round had to infer CI's object from a byte count in a log; the moment two
      # real files could be diffed, "same size, different bytes" became "six
      # bytes, two transpositions, .BTF type section". A regeneration mismatch
      # should never have to be debugged blind again.
      #
      # if: failure() so a green run costs nothing. Deliberately placed AFTER the
      # verify step, whose failure is what makes these objects worth having.
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: regenerated-objects-${{ matrix.arch }}
        path: |
          **/*_bpfel.o
          **/*_bpfel.go
        if-no-files-found: warn

    - name: Build perf-agent
      run: go build -v .
    
    # ./pyunwind/... is here because it was in no CI job before; see the
    # same step in tests.yml.
    - name: Run unit tests
      run: go test -v ./cpu/... ./profile/... ./offcpu/... ./pyunwind/... ./unwind/dwarfagent/...
    
    - name: Build test workloads
      run: |
        cd test/workloads/go
        go build -o cpu_bound cpu_bound.go
        go build -o io_bound io_bound.go
        cd ../rust
        cargo build --release
        cd ../python
        chmod +x *.py
    
    - name: Check Python perf support
      run: |
        python3 --version
        python3 -X perf -c "print('Python perf support available')" || echo "Python perf not available"

  # Integration tests require root and are harder to run in CI
  # They can be run manually or in a different environment
  integration-tests:
    name: Integration Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: false  # Disabled by default, enable when you have a way to run with root
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Run integration tests
      run: |
        cd test
        sudo env LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH" \
          go test -v -timeout 5m ./...
