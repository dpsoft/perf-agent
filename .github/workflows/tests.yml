          git diff --name-only -- '*_bpfel.go' '*_bpfel.o' || true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -o perf-agent-linux-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-agent-linux-${{ matrix.goarch }}
          path: perf-agent-linux-${{ matrix.goarch }}
