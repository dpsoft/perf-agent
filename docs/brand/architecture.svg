<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 872" width="1040" height="872"
     font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
     role="img" aria-label="perf-agent architecture">
<title>perf-agent architecture</title>
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
  </marker>
</defs>
<style>
  svg { color: #8b8597; background: #f7f6f9; }
  .band { fill: #efedf3; stroke: #e0dde6; }
  .bandlabel { font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
                text-transform: uppercase; fill: #7b7589; }
  .b { fill: #ffffff; stroke: #d9d5e0; }
  .t  { font-size: 13px; font-weight: 650; fill: #1e1d23; }
  .tm { font-size: 12px; font-weight: 650; fill: #1e1d23;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .s  { font-size: 10.5px; fill: #6c6679; }
  .a  { stroke: #9a93a8; stroke-width: 1.4; fill: none; }
  .py   { stroke: #3fa0ab; stroke-width: 1.8; }
  .nat  { stroke: #d1497f; stroke-width: 1.8; }
  .gpu  { stroke: #44a85e; stroke-width: 1.8; }
  .shim { stroke: #44a85e; stroke-width: 1.8; fill: #f3fbf5; }
  .pyw  { stroke: #3fa0ab; stroke-width: 1.8; fill: #f2fafb; }
  .prog { fill: #ffffff; }
  .map  { fill: #faf9fc; }
  .gpumap { stroke: #44a85e; stroke-width: 1.8; }
  .out  { fill: #faf9fc; }
  .fileb{ fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    svg { color: #6f6880; background: #16151a; }
    .band { fill: #1b1a21; stroke: #2a2733; }
    .bandlabel { fill: #8e879e; }
    .b { fill: #212028; stroke: #343040; }
    .t, .tm { fill: #eceaf2; }
    .s { fill: #a29caf; }
    .a { stroke: #6f6880; }
    .shim { fill: #17241a; }
    .pyw  { fill: #152224; }
    .map, .out { fill: #1d1c23; }
    .fileb { fill: #212028; }
  }
</style>
<rect class="band" x="0" y="0" width="1040" height="150" rx="10"/>
<text class="bandlabel" x="16" y="19">TARGET PROCESS — perf-agent never writes to it</text>
<rect class="b py" x="20" y="34" width="184" height="44" rx="7"/>
<text class="t" x="32" y="52" text-anchor="start">Python frames</text>
<text class="s" x="32" y="67" text-anchor="start">CPython 3.12–3.14</text>
<rect class="b nat" x="220" y="34" width="184" height="44" rx="7"/>
<text class="t" x="232" y="52" text-anchor="start">C / C++ / Rust frames</text>
<text class="s" x="232" y="67" text-anchor="start">FP or .eh_frame</text>
<rect class="b gpu" x="420" y="34" width="184" height="44" rx="7"/>
<text class="t" x="432" y="52" text-anchor="start">CUDA launches</text>
<text class="s" x="432" y="67" text-anchor="start">cuLaunchKernel, …</text>
<rect class="b shim" x="640" y="34" width="384" height="96" rx="7"/>
<text class="t" x="652" y="52" text-anchor="start">libperfagent-gpu-nvidia.so</text>
<text class="s" x="652" y="67" text-anchor="start">loaded at cuInit via CUDA_INJECTION64_PATH —</text>
<text class="s" x="652" y="80" text-anchor="start">cannot be added to a live process</text>
<text class="s" x="652" y="93" text-anchor="start">samples 1 launch in N → USDT probe</text>
<text class="s" x="652" y="106" text-anchor="start">+ CUPTI kernel activity records (the GPU time)</text>
<path class="a" d="M512,56 L636,56" marker-end="url(#ah)"/>
<rect class="band" x="0" y="176" width="1040" height="286" rx="10"/>
<text class="bandlabel" x="16" y="195">KERNEL SPACE (eBPF)</text>
<rect class="b prog" x="20" y="212" width="185" height="56" rx="7"/>
<text class="tm" x="31" y="230" text-anchor="start">perf.bpf.c</text>
<text class="s" x="31" y="245" text-anchor="start">FP only</text>
<text class="s" x="31" y="258" text-anchor="start">aggregated counts</text>
<rect class="b prog" x="221" y="212" width="185" height="56" rx="7"/>
<text class="tm" x="232" y="230" text-anchor="start">perf_dwarf.bpf.c</text>
<text class="s" x="232" y="245" text-anchor="start">hybrid: FP fast path,</text>
<text class="s" x="232" y="258" text-anchor="start">DWARF for FP-less PCs</text>
<rect class="b prog" x="422" y="212" width="185" height="56" rx="7"/>
<text class="tm" x="433" y="230" text-anchor="start">offcpu.bpf.c</text>
<text class="s" x="433" y="245" text-anchor="start">+ offcpu_dwarf</text>
<text class="s" x="433" y="258" text-anchor="start">sched_switch, blocking-ns</text>
<rect class="b prog" x="623" y="212" width="185" height="56" rx="7"/>
<text class="tm" x="634" y="230" text-anchor="start">cpu.bpf.c</text>
<text class="s" x="634" y="245" text-anchor="start">HW counters</text>
<text class="s" x="634" y="258" text-anchor="start">rq latency, ctx switch</text>
<rect class="b prog" x="824" y="212" width="185" height="56" rx="7"/>
<text class="tm" x="835" y="230" text-anchor="start">gpu_usdt.bpf.c</text>
<text class="s" x="835" y="245" text-anchor="start">walks the LAUNCHING</text>
<text class="s" x="835" y="258" text-anchor="start">stack at the USDT</text>
<rect class="b pyw" x="300" y="312" width="440" height="56" rx="7"/>
<text class="tm" x="312" y="330" text-anchor="start">pywalk_probe.bpf.c</text>
<text class="s" x="312" y="345" text-anchor="start">walks CPython's own frame chain — no injection into the target,</text>
<text class="s" x="312" y="358" text-anchor="start">no CAP_SYS_PTRACE, nothing mutated</text>
<path class="a" d="M313,270 L313,296 L430,296 L430,308" marker-end="url(#ah)"/>
<path class="a" d="M514,270 L514,296 L520,296 L520,308" marker-end="url(#ah)"/>
<path class="a" d="M917,270 L917,296 L700,296 L700,308" marker-end="url(#ah)"/>
<text class="s" x="520" y="286" text-anchor="middle">tail call, when the PC is inside the interpreter's eval loop</text>
<rect class="b map" x="20" y="390" width="300" height="46" rx="7"/>
<text class="tm" x="32" y="409" text-anchor="start">stack ringbuf</text>
<text class="s" x="32" y="425" text-anchor="start">DWARF path</text>
<rect class="b map" x="350" y="390" width="300" height="46" rx="7"/>
<text class="tm" x="362" y="409" text-anchor="start">aggregated maps</text>
<text class="s" x="362" y="425" text-anchor="start">FP path</text>
<rect class="b map gpumap" x="680" y="390" width="344" height="46" rx="7"/>
<text class="tm" x="692" y="409" text-anchor="start">events ringbuf</text>
<text class="s" x="692" y="425" text-anchor="start">GPU path, 4 MB — --gpu-ring-bytes resizes it</text>
<text class="s" x="520" y="456" text-anchor="middle">CFI tables + pid_mappings in HASH_OF_MAPS keyed by build-id</text>
<path class="a" d="M430,368 L430,378 L170,378 L170,386" marker-end="url(#ah)"/>
<path class="a" d="M112,270 L112,378 L500,378 L500,386" marker-end="url(#ah)"/>
<path class="a" d="M917,270 L852,386" marker-end="url(#ah)"/>
<rect class="band" x="0" y="488" width="1040" height="258" rx="10"/>
<text class="bandlabel" x="16" y="507">USER SPACE (Go)</text>
<rect class="b go" x="20" y="522" width="300" height="52" rx="7"/>
<text class="tm" x="32" y="540" text-anchor="start">perfagent.Agent</text>
<text class="s" x="32" y="555" text-anchor="start">lifecycle + --unwind dispatch</text>
<rect class="b go gpu" x="700" y="522" width="324" height="52" rx="7"/>
<text class="tm" x="712" y="540" text-anchor="start">gpuprobe.Consumer</text>
<text class="s" x="712" y="555" text-anchor="start">ringbuf → decoded records</text>
<rect class="b go" x="20" y="592" width="300" height="56" rx="7"/>
<text class="tm" x="32" y="610" text-anchor="start">unwind/dwarfagent</text>
<text class="s" x="32" y="625" text-anchor="start">hybrid walker; ehcompile builds CFI,</text>
<text class="s" x="32" y="638" text-anchor="start">ehmaps keeps it per-PID (MMAP2)</text>
<rect class="b go gpu" x="700" y="592" width="324" height="56" rx="7"/>
<text class="tm" x="712" y="610" text-anchor="start">gpu.Timeline + gpu.ModuleStore</text>
<text class="s" x="712" y="625" text-anchor="start">joins kernel ⇄ launching stack on</text>
<text class="s" x="712" y="638" text-anchor="start">CUPTI's correlation id</text>
<rect class="b go" x="360" y="592" width="300" height="56" rx="7"/>
<text class="tm" x="372" y="610" text-anchor="start">unwind/procmap.Resolver</text>
<text class="s" x="372" y="625" text-anchor="start">/proc/&lt;pid&gt;/maps + build-id,</text>
<text class="s" x="372" y="638" text-anchor="start">lazy per-PID</text>
<rect class="b out" x="20" y="666" width="1004" height="56" rx="7"/>
<text class="tm" x="32" y="684" text-anchor="start">pprof/ ProfileBuilder</text>
<text class="s" x="32" y="699" text-anchor="start">address-keyed Locations + per-binary Mapping (build-id, file offsets) + kernel/[jit] sentinels   ·   symbolization: blazesym (DWARF, ELF, .gnu_debugdata, perf-maps), optional debuginfod</text>
<path class="a" d="M170,574 L170,588" marker-end="url(#ah)"/>
<path class="a" d="M862,574 L862,588" marker-end="url(#ah)"/>
<path class="a" d="M170,648 L170,662" marker-end="url(#ah)"/>
<path class="a" d="M510,648 L510,662" marker-end="url(#ah)"/>
<path class="a" d="M862,648 L862,662" marker-end="url(#ah)"/>
<rect class="band" x="0" y="772" width="1040" height="92" rx="10"/>
<text class="bandlabel" x="16" y="791">OUTPUT</text>
<rect class="b fileb" x="20" y="810" width="478" height="42" rx="7"/>
<text class="tm" x="32" y="830" text-anchor="start">*-on-cpu.pb.gz   *-off-cpu.pb.gz   *-gpu.pb.gz</text>
<text class="s" x="32" y="844" text-anchor="start">PMU: console / file</text>
<rect class="b fileb" x="530" y="810" width="494" height="42" rx="7"/>
<text class="tm" x="542" y="830" text-anchor="start">cmd/flamegraph → self-contained HTML</text>
<text class="s" x="542" y="844" text-anchor="start">-fuse: CPU + GPU in one tree</text>
<path class="a" d="M200,150 L200,208" marker-end="url(#ah)"/>
<text class="s" x="208" y="172" text-anchor="start">perf_event / sched_switch</text>
<path class="a" d="M830,130 L830,208" marker-end="url(#ah)"/>
<text class="s" x="838" y="172" text-anchor="start">USDT (uprobe)</text>
<path class="a" d="M170,436 L170,518" marker-end="url(#ah)"/>
<path class="a" d="M852,436 L862,518" marker-end="url(#ah)"/>
<path class="a" d="M520,722 L520,806" marker-end="url(#ah)"/>
</svg>
