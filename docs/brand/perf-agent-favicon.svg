<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     role="img" aria-label="perf-agent">
  <title>perf-agent</title>
  <!-- Favicon mark: the full mark loses its top rows below ~24px, so this is a
       redrawn three-row version, not a scaled copy. Same taper, same colour
       climb, two bars per row at most. -->
  <rect x="1"  y="11" width="14" height="4" rx="1.3" fill="#d1497f"/>
  <rect x="1"  y="6"  width="6"  height="4" rx="1.3" fill="#e8873a"/>
  <rect x="8"  y="6"  width="7"  height="4" rx="1.3" fill="#3fa0ab"/>
  <rect x="9"  y="1"  width="6"  height="4" rx="1.3" fill="#44a85e"/>
</svg>
