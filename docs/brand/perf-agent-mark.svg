<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="perf-agent">
  <title>perf-agent</title>
  <!-- A flame built from profile bars. Row centres drift right as the rows
       narrow (32 -> 42 across six rows), so the silhouette leans and tapers
       the way a flame does while every bar stays a legible stack frame.
       Colour climbs application -> boundary -> GPU kernel in the flame
       graph's own hues (335 / 28 / 184 / 128). -->
  <g>
    <rect x="4"  y="52" width="56" height="8" rx="2.5" fill="#d1497f"/>
    <rect x="10" y="42" width="18" height="8" rx="2.5" fill="#d1497f" opacity=".72"/>
    <rect x="31" y="42" width="25" height="8" rx="2.5" fill="#e8873a"/>
    <rect x="18" y="32" width="12" height="8" rx="2.5" fill="#e8873a" opacity=".78"/>
    <rect x="33" y="32" width="20" height="8" rx="2.5" fill="#3fa0ab"/>
    <rect x="26" y="22" width="8"  height="8" rx="2.5" fill="#3fa0ab" opacity=".72"/>
    <rect x="36" y="22" width="15" height="8" rx="2.5" fill="#44a85e"/>
    <rect x="34" y="12" width="14" height="8" rx="2.5" fill="#44a85e"/>
    <rect x="38" y="4"  width="8"  height="6" rx="2"   fill="#5fc07a"/>
  </g>
</svg>
