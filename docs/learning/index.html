    &quot;message&quot;,

    &lt;div class=&quot;quiz-result&quot; data-slot=&quot;quiz-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;h3&gt;Do sampled launch widths reveal every caller’s share of GPU time?&lt;/h3&gt;
    &lt;div class=&quot;lesson-controls&quot; role=&quot;group&quot; aria-label=&quot;Launch sampling knowledge check&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-width-answer=&quot;yes&quot; aria-pressed=&quot;false&quot;&gt;Yes&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-width-answer=&quot;no&quot; aria-pressed=&quot;false&quot;&gt;No&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;quiz-result&quot; data-slot=&quot;width-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;pa-gpu-lesson-one&#x27;);
      const find = s =&gt; root.querySelector(s);
      const svg = find(&#x27;svg&#x27;);
      const host = find(&#x27;[data-slot=&quot;diagram-host&quot;]&#x27;);
      const play = find(&#x27;[data-action=&quot;play&quot;]&#x27;);
      const back = find(&#x27;[data-action=&quot;back&quot;]&#x27;);
      const next = find(&#x27;[data-action=&quot;next&quot;]&#x27;);
      const profiler = find(&#x27;[data-option=&quot;profiler&quot;]&#x27;);
      const caller = find(&#x27;[data-option=&quot;caller&quot;]&#x27;);
      const waitMode = find(&#x27;[data-option=&quot;wait&quot;]&#x27;);
      const steps = [
        { t:1, from:0, title:&#x27;Prepare on the CPU&#x27;, detail:&#x27;Python prepares inputs; the GPU has no work yet.&#x27; },
        { t:2.6, from:2, title:&#x27;Submit GPU work&#x27;, detail:&#x27;A CUDA launch submits a kernel; its CPU call is not the kernel execution.&#x27; },
        { t:4.5, from:3, title:&#x27;CPU and GPU overlap&#x27;, detail:&#x27;The launch returned. The CPU does other work while the GPU runs.&#x27; },
        { t:7.5, from:6, title:&#x27;Wait for the result&#x27;, detail:&#x27;The CPU thread actively waits here; periodic CPU samples can include the wait.&#x27; },
        { t:10.6, from:10, title:&#x27;Use the result&#x27;, detail:&#x27;The kernel finished. The CPU thread resumes with its result.&#x27; },
        { t:12, from:11.5, title:&#x27;Connect the evidence&#x27;, detail:&#x27;GPU elapsed duration is measured; a separately sampled launch stack can identify its caller.&#x27; }
      ];
      const state = { time:1, overlay:false, sampled:true, wait:&#x27;active&#x27;, answer:null, widthAnswer:null };
      const instanceKey = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;
      let running = false, raf = null, lastStamp = null, lastStep = -1;
      let lastReducedStep = 0;
      const reduced = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const stepAt = time =&gt; steps.reduce((index, item, i) =&gt; time &gt;= item.from ? i : index, 0);
      const clamp = (v, lo, hi) =&gt; Math.min(hi, Math.max(lo, v));

      function applySaved(snapshot) {
        const saved = snapshot?.modelContent;
        if (!saved || saved.lesson !== &#x27;cpu-to-gpu-v2&#x27;) return;
        if (Number.isInteger(saved.step) &amp;&amp; saved.step &gt;= 0 &amp;&amp; saved.step &lt; steps.length) state.time = steps[saved.step].t;
        if (typeof saved.profiler === &#x27;boolean&#x27;) state.overlay = saved.profiler;
        if (typeof saved.launchStack === &#x27;boolean&#x27;) state.sampled = saved.launchStack;
        if (saved.wait === &#x27;active&#x27; || saved.wait === &#x27;sleep&#x27;) state.wait = saved.wait;
        if (saved.answer === &#x27;yes&#x27; || saved.answer === &#x27;no&#x27;) state.answer = saved.answer;
        if (saved.widthAnswer === &#x27;yes&#x27; || saved.widthAnswer === &#x27;no&#x27;) state.widthAnswer = saved.widthAnswer;
      }
      function save() {
        if (root.hasAttribute(&#x27;data-course-embedded&#x27;)) {
          root.dispatchEvent(new CustomEvent(&#x27;gpu-model-change&#x27;,{bubbles:true,detail:{step:stepAt(state.time),profiler:state.overlay,launchStack:state.sampled,wait:state.wait,answer:state.answer,widthAnswer:state.widthAnswer}}));
          return;
        }
        if (typeof window.openai?.setWidgetState !== &#x27;function&#x27;) return;
        window.openai.setWidgetState({
          modelContent:{ lesson:&#x27;cpu-to-gpu-v2&#x27;, step:stepAt(state.time), profiler:state.overlay, launchStack:state.sampled, wait:state.wait, answer:state.answer, widthAnswer:state.widthAnswer },
          privateContent:{ instanceKey }
        }).catch(() =&gt; {});
      }
      const el = (name, attrs = {}, text) =&gt; {
        const node = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, name);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
        if (text !== undefined) node.textContent = text;
        svg.appendChild(node);
        return node;
      };
      const text = (x, y, value, attrs = {}) =&gt; el(&#x27;text&#x27;, { x, y, ...attrs }, value);

      function draw() {
        const width = Math.max(220, host.getBoundingClientRect().width);
        const x0 = 54, plot = Math.max(160, width - x0 - 8), x = t =&gt; x0 + plot * t / 12;
        const mobile = plot &lt; 430;
        const time = Math.min(state.time,12);
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${state.overlay ? 290 : 264}`);
        svg.style.height = `${state.overlay ? 290 : 264}px`;
        svg.replaceChildren();
        el(&#x27;title&#x27;, {}, `One CPU thread submits a kernel, works concurrently, ${state.wait === &#x27;sleep&#x27; ? &#x27;sleeps&#x27; : &#x27;actively waits&#x27;} for the GPU, then resumes.`);
        el(&#x27;desc&#x27;, {}, &#x27;Illustrative execution, not a recorded trace. Dots represent periodic CPU samples. A separate diamond marks a launch-stack probe, not a timer sample. CUPTI start/end measurements become available after kernel completion.&#x27;);
        text(x0, 15, &#x27;Earlier&#x27;, { class:&#x27;secondary text-small&#x27; });
        text(x(12), 15, &#x27;Later →&#x27;, { class:&#x27;secondary text-small&#x27;, &#x27;text-anchor&#x27;:&#x27;end&#x27; });
        text(0, 94, &#x27;CPU&#x27;);
        text(0, 219, &#x27;GPU&#x27;);
        text(0, 237, &#x27;stream 0&#x27;, { class:&#x27;secondary text-small&#x27; });
        el(&#x27;line&#x27;, { x1:x0, y1:113, x2:x(12), y2:113, class:&#x27;structure&#x27; });
        el(&#x27;line&#x27;, { x1:x0, y1:242, x2:x(12), y2:242, class:&#x27;structure&#x27; });
        const segment = (start, end, y, label, color) =&gt; {
          const left = x(start), total = x(end) - left - 2;
          el(&#x27;rect&#x27;, { x:left, y, width:total, height:38, rx:3, class:&#x27;future-fill&#x27; });
          const filled = clamp((time - start) / (end - start), 0, 1) * total;
          if (filled &gt; 0) el(&#x27;rect&#x27;, { x:left, y, width:filled, height:38, rx:3, class:color, opacity:.34 });
          if (total &gt; label.length * 7.5 + 5) text(left + total/2, y + 24, label, { &#x27;text-anchor&#x27;:&#x27;middle&#x27; });
        };
        segment(0,2,74,&#x27;Prep&#x27;,&#x27;cpu-fill&#x27;);
        segment(2,3,74,mobile || state.overlay ? &#x27;&#x27; : &#x27;Launch&#x27;,&#x27;cpu-fill&#x27;);
        segment(3,6,74,mobile ? &#x27;Work&#x27; : &#x27;Other work&#x27;,&#x27;cpu-fill&#x27;);
        segment(6,10,74,&#x27;Wait&#x27;,&#x27;wait-fill&#x27;);
        segment(10,12,74,&#x27;Use&#x27;,&#x27;cpu-fill&#x27;);
        segment(3,10,202,mobile ? &#x27;Kernel&#x27; : &#x27;Kernel execution&#x27;,&#x27;gpu-fill&#x27;);
        if (time &gt;= 2) {
          const source = x(2.5), dest = x(3) + 6;
          el(&#x27;path&#x27;, { d:`M ${source} 114 V 151 H ${dest} V 198`, class:&#x27;observation&#x27; });
          el(&#x27;polyline&#x27;, { points:`${dest-4},192 ${dest},198 ${dest+4},192`, class:&#x27;observation&#x27; });
          text(x0 + plot/2, 176, state.overlay ? &#x27;CUPTI correlation ID&#x27; : &#x27;Submit kernel to stream&#x27;, { &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;secondary&#x27; });
        }
        if (state.overlay) {
          const samples = [.4,.9,1.4,1.8,2.2,3.4,4.1,4.9,5.6,10.4,11.1,11.7];
          if (state.wait === &#x27;active&#x27;) samples.push(6.4,7.2,7.9,8.6,9.3);
          for (const t of samples.filter(t =&gt; t &lt;= time)) el(&#x27;circle&#x27;, { cx:x(t), cy:55, r:3, class:&#x27;cpu-fill&#x27; });
          text(x0, 39, &#x27;eBPF: periodic CPU samples&#x27;, { class:&#x27;secondary text-small&#x27; });
          if (time &gt;= 2.5 &amp;&amp; state.sampled) {
            const sx = x(2.5);
            el(&#x27;polygon&#x27;, { points:`${sx},87 ${sx+6},93 ${sx},99 ${sx-6},93`, class:&#x27;cpu-fill&#x27;, &#x27;data-marker&#x27;:&#x27;launch-probe&#x27; });
          }
          if (time &gt;= 6 &amp;&amp; state.wait === &#x27;sleep&#x27;) {
            el(&#x27;line&#x27;, { x1:x(6), y1:124, x2:x(Math.min(time,10)), y2:124, class:&#x27;observation&#x27; });
            text(x(12), 147, mobile ? &#x27;Off-CPU wait&#x27; : &#x27;Sleeping wait: optional --offcpu&#x27;, { &#x27;text-anchor&#x27;:&#x27;end&#x27;, class:&#x27;secondary text-small&#x27; });
          }
          if (time &gt;= 10) {
            el(&#x27;path&#x27;, { d:`M ${x(3)} 250 v 7 H ${x(10)} v -7`, class:&#x27;observation&#x27;, &#x27;data-marker&#x27;:&#x27;completed-duration&#x27; });
            text(x0 + plot/2, 280, mobile ? &#x27;CUPTI: start/end → duration&#x27; : &#x27;CUPTI start/end → kernel elapsed duration&#x27;, { &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;secondary text-small&#x27; });
          } else if (time &gt;= 3) {
            text(x0 + plot/2, 280, &#x27;CUPTI activity record pending&#x27;, { &#x27;text-anchor&#x27;:&#x27;middle&#x27;, class:&#x27;secondary text-small&#x27; });
          }
        }
        el(&#x27;line&#x27;, { x1:x(time), y1:62, x2:x(time), y2:114, class:&#x27;cursor-line&#x27; });
        el(&#x27;line&#x27;, { x1:x(time), y1:194, x2:x(time), y2:245, class:&#x27;cursor-line&#x27; });
        el(&#x27;circle&#x27;, { cx:x(time), cy:62, r:3, fill:&#x27;currentColor&#x27; });
      }

      function drawReal(width) {
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} 310`);
        svg.style.height=&#x27;310px&#x27;;
        el(&#x27;title&#x27;, {}, &#x27;Real capture loop/002: approximately 6.23 seconds of recorded GPU kernel durations. 12.1 percent has a captured caller; 87.9 percent has no captured caller. CPU synchronization under item has approximately 9.33 seconds of sampled on-CPU time.&#x27;);
        el(&#x27;desc&#x27;, {}, &#x27;GPU fractions describe recorded kernel duration in this capture, not sampling guarantees, utilization or wall-clock runtime. CPU and GPU values are separate accumulated measurements.&#x27;);
        text(0,24,&#x27;Recorded GPU durations · ≈6.23 s&#x27;);
        const full=width-8, split=full*.121;
        el(&#x27;rect&#x27;,{x:0,y:48,width:split,height:32,rx:2,class:&#x27;gpu-fill&#x27;,opacity:.8});
        el(&#x27;rect&#x27;,{x:split+2,y:48,width:full-split-2,height:32,rx:2,class:&#x27;gpu-fill&#x27;,opacity:.3});
        text(0,112,&#x27;Captured caller&#x27;);
        text(full,112,&#x27;≈0.75 s · 12.1%&#x27;,{&#x27;text-anchor&#x27;:&#x27;end&#x27;});
        text(0,146,&#x27;Unknown caller&#x27;);
        text(full,146,&#x27;≈5.48 s · 87.9%&#x27;,{&#x27;text-anchor&#x27;:&#x27;end&#x27;});
        text(0,194,&#x27;CPU: synchronization under .item()&#x27;);
        text(0,224,&#x27;≈9.33 s of on-CPU samples&#x27;);
        text(0,248,&#x27;12.1% of the CPU sample total&#x27;,{class:&#x27;secondary text-small&#x27;});
        text(0,285,&#x27;Accumulated values ≠ wall-clock time&#x27;,{class:&#x27;secondary text-small&#x27;});
      }

      function render() {
        const i = stepAt(state.time);
        const real = false;
        profiler.checked = state.overlay;
        profiler.disabled = real;
        caller.checked = state.sampled;
        waitMode.value = state.wait;
        find(&#x27;[data-slot=&quot;wait-control&quot;]&#x27;).hidden=real;
        find(&#x27;.lane-key&#x27;).hidden=real;
        find(&#x27;[data-slot=&quot;launch-key&quot;]&#x27;).hidden = !state.overlay || real;
        play.textContent = running ? &#x27;Pause&#x27; : state.time &gt;= 12 ? &#x27;Replay&#x27; : &#x27;Play&#x27;;
        back.disabled = i === 0;
        next.disabled = i === steps.length - 1;
        find(&#x27;[data-slot=&quot;profiler-evidence&quot;]&#x27;).hidden = !state.overlay || real;
        find(&#x27;[data-slot=&quot;wait-legend&quot;]&#x27;).textContent = state.wait === &#x27;sleep&#x27; ? &#x27;Sleeping CPU wait&#x27; : &#x27;Active CPU wait&#x27;;
        const titleText=`${i+1} / 6 · ${steps[i].title}`;
        const detailText=i === 3 ? state.wait === &#x27;sleep&#x27;
          ? &#x27;This CPU thread sleeps here. Optional off-CPU profiling records its descheduled wait.&#x27;
          : &#x27;This CPU thread actively waits here; periodic CPU samples can include synchronization.&#x27; : steps[i].detail;
        if (find(&#x27;[data-slot=&quot;step-title&quot;]&#x27;).textContent !== titleText) find(&#x27;[data-slot=&quot;step-title&quot;]&#x27;).textContent=titleText;
        if (find(&#x27;[data-slot=&quot;step-detail&quot;]&#x27;).textContent !== detailText) find(&#x27;[data-slot=&quot;step-detail&quot;]&#x27;).textContent=detailText;
        lastStep=i;
        find(&#x27;[data-slot=&quot;provenance&quot;]&#x27;).textContent = real ? &#x27;Real capture · loop/002 · synthetic PyTorch workload · recorded 20 Nov 2026&#x27; : &#x27;Illustrative model · one CPU thread · one GPU stream · timings, dots and call path are not captured data.&#x27;;
        const chain = find(&#x27;[data-slot=&quot;stack-chain&quot;]&#x27;);
        find(&#x27;[data-slot=&quot;caller-status&quot;]&#x27;).textContent = state.time &lt; 3 ? &#x27;No GPU execution yet.&#x27; : state.time &lt; 10
          ? &#x27;Illustrated kernel running; completed activity record pending.&#x27; : state.sampled
          ? &#x27;Measured kernel elapsed duration, linked to a sampled caller.&#x27; : &#x27;Measured kernel elapsed duration; caller unknown.&#x27;;
        const names = state.time &lt; 2.5 ? [&#x27;Launch has not been observed yet&#x27;] : state.time &lt; 10 ? state.sampled ? [&#x27;CPU launch path&#x27;, &#x27;launch-stack probe&#x27;] : [&#x27;No launch stack captured&#x27;] : state.sampled
          ? [&#x27;CPU launch path&#x27;, &#x27;[gpu:launch]&#x27;, &#x27;[gpu:kernel:example_kernel]&#x27;]
          : [&#x27;[gpu:launch unsampled]&#x27;, &#x27;[gpu:kernel:example_kernel]&#x27;];
        const key = names.join(&#x27;|&#x27;);
        if (chain.dataset.key !== key) {
          chain.replaceChildren();
          names.forEach((name,index) =&gt; {
            if (index) { const arrow = document.createElement(&#x27;span&#x27;); arrow.textContent = &#x27;→&#x27;; arrow.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;); chain.appendChild(arrow); }
            const part = document.createElement(names.length &gt; 1 ? &#x27;code&#x27; : &#x27;span&#x27;); part.textContent = name; chain.appendChild(part);
          });
          chain.dataset.key = key;
        }
        root.querySelectorAll(&#x27;[data-answer]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.answer === state.answer)));
        find(&#x27;[data-slot=&quot;quiz-result&quot;]&#x27;).textContent = state.answer === &#x27;no&#x27;
          ? &#x27;Correct. The launch can return before the kernel finishes—or even starts.&#x27;
          : state.answer === &#x27;yes&#x27; ? &#x27;Not necessarily. A returned launch does not prove completion; synchronization can establish it.&#x27; : &#x27;&#x27;;
        root.querySelectorAll(&#x27;[data-width-answer]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;,String(button.dataset.widthAnswer===state.widthAnswer)));
        find(&#x27;[data-slot=&quot;width-result&quot;]&#x27;).textContent = state.widthAnswer === null ? &#x27;&#x27; : state.widthAnswer === &#x27;no&#x27;
          ? &#x27;Correct. The captured callers are a sample of launches. Their widths do not reveal all callers’ GPU-time shares.&#x27;
          : &#x27;No. One in eight launches does not mean one eighth of GPU time: kernels can have different durations.&#x27;;
        draw();
      }

      function stop() {
        running = false;
        if (raf !== null) cancelAnimationFrame(raf);
        raf = null; lastStamp = null; lastReducedStep = 0;
      }
      function tick(stamp) {
        if (!running || !root.isConnected) { stop(); return; }
        if (lastStamp === null) lastStamp = stamp;
        const dt = Math.min((stamp - lastStamp) / 1000, .1);
        lastStamp = stamp;
        if (reduced.matches) {
          lastReducedStep += dt;
          if (lastReducedStep &gt;= 3) {
            state.time = steps[Math.min(stepAt(state.time)+1,5)].t;
            lastReducedStep = 0;
          }
        } else state.time = Math.min(12, state.time + dt*.38);
        if (state.time &gt;= 12) { stop(); save(); }
        render();
        if (running) raf = requestAnimationFrame(tick);
      }

      play.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (running) stop();
        else { if (state.time &gt;= 12) state.time = steps[0].t; running = true; lastStamp = null; raf = requestAnimationFrame(tick); }
        render(); save();
      });
      back.addEventListener(&#x27;click&#x27;, () =&gt; { stop(); state.time = steps[Math.max(0,stepAt(state.time)-1)].t; render(); save(); });
      next.addEventListener(&#x27;click&#x27;, () =&gt; { stop(); state.time = steps[Math.min(6,stepAt(state.time)+1)].t; render(); save(); });
      profiler.addEventListener(&#x27;change&#x27;, () =&gt; { state.overlay = profiler.checked; render(); save(); });
      caller.addEventListener(&#x27;change&#x27;, () =&gt; { state.sampled = caller.checked; render(); save(); });
      waitMode.addEventListener(&#x27;change&#x27;, () =&gt; { state.wait = waitMode.value; render(); save(); });
      root.querySelectorAll(&#x27;[data-answer]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { state.answer = button.dataset.answer; render(); save(); }));
      root.querySelectorAll(&#x27;[data-width-answer]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { state.widthAnswer = button.dataset.widthAnswer; render(); save(); }));
      root.addEventListener(&#x27;gpu-model-restore&#x27;,event=&gt;{stop();applySaved({modelContent:{lesson:&#x27;cpu-to-gpu-v2&#x27;,...event.detail}});render();});
      root.addEventListener(&#x27;gpu-model-pause&#x27;,event=&gt;{stop();render();if(event.detail?.persist)save();});
      window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
        if(root.hasAttribute(&#x27;data-course-embedded&#x27;))return;
        const snapshot = event.detail?.globals?.widgetState;
        if (!snapshot || snapshot.privateContent?.instanceKey === instanceKey) return;
        stop(); applySaved(snapshot); render();
      });
      document.addEventListener(&#x27;visibilitychange&#x27;, () =&gt; { if (document.hidden &amp;&amp; running) { stop(); render(); save(); } });
      new ResizeObserver(draw).observe(host);
      if(!root.hasAttribute(&#x27;data-course-embedded&#x27;))applySaved(window.openai?.widgetState);
      render();
    })();
  &lt;/script&gt;

  &lt;section class=&quot;course-panel&quot; data-course-panel=&quot;inspect&quot; aria-label=&quot;Explore recorded profile evidence&quot; hidden&gt;
    &lt;div class=&quot;course-actions&quot; role=&quot;group&quot; aria-label=&quot;Profile measurement&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-inspect=&quot;gpu&quot; aria-pressed=&quot;true&quot;&gt;GPU durations&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-inspect=&quot;cpu&quot; aria-pressed=&quot;false&quot;&gt;CPU synchronization&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;inspection&quot; data-inspection=&quot;gpu&quot;&gt;
      &lt;h3&gt;Recorded GPU durations · ≈6.23 s accumulated&lt;/h3&gt;
      &lt;svg class=&quot;profile-split&quot; role=&quot;img&quot; aria-label=&quot;Recorded GPU duration: 12.1 percent with a captured caller, 87.9 percent without one&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;course-actions&quot; role=&quot;group&quot; aria-label=&quot;Caller population&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-population=&quot;captured&quot; aria-pressed=&quot;true&quot;&gt;Captured caller · 12.1%&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-population=&quot;unknown&quot; aria-pressed=&quot;false&quot;&gt;Unknown caller · 87.9%&lt;/button&gt;
      &lt;/div&gt;
      &lt;h3 data-course-slot=&quot;path-title&quot;&gt;Example within captured callers&lt;/h3&gt;
      &lt;ol class=&quot;path&quot; data-course-slot=&quot;gpu-path&quot;&gt;&lt;/ol&gt;
      &lt;div data-course-slot=&quot;path-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
      &lt;details data-course-slot=&quot;symbol-details&quot;&gt;
        &lt;summary&gt;Full recorded kernel symbol&lt;/summary&gt;
        &lt;code class=&quot;recorded-symbol&quot;&gt;[gpu:kernel:_ZN7cutlass7Kernel2I42cutlass_80_simt_sgemm_128x32_8x5_nt_align1EEvNT_6ParamsE]&lt;/code&gt;
      &lt;/details&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;Selected frames shown root to leaf; intermediate frames omitted. GPU weights are accumulated durations, not an execution timeline.&lt;/span&gt;
